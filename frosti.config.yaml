# 网站的基本信息
site:
  tab: Kistory的修养生息小站 # 浏览器标签栏上显示的文本
  title: Kistory'Blog # 网站的标题
  description: 记录技术、生活与沿途的思考。 # 网站的描述，用于SEO等
  language: zh # 网站的语言；翻译文件中使用 zh
  favicon: /favicon.ico # 网站的图标，用于浏览器标签栏和其他地方显示
  home: # 首页入口文案和按钮；修改这里即可自定义首页内容
    avatar: /profile.webp # 圆形头像，可替换为 public 文件夹中的图片
    title: Kistory
    eyebrow: KISTORY'S BLOG
    description: 欢迎来到我的世界！
    primary:
      text: 博客
      href: /blog
    links: # 下面的胶囊按钮；可增删，图标使用 Iconify 名称
      - text: 文章归档
        href: /blog/archives
        icon: lucide:archive
      - text: 标签
        href: /blog/tags
        icon: lucide:tags
      - text: GitHub
        href: https://github.com/OnlyOneArborInMyHeart
        icon: lucide:github
    footer: 探索博客
  theme: # 更多主题 https://daisyui.com/docs/themes/
    light: winter # 主题的浅色模式
    dark: dracula # 主题的深色模式
    code: github-dark # 代码块的主题 https://shiki.style/themes
  date_format: ddd MMM DD YYYY # 日期格式设置，支持自定义格式
  menu: # 菜单配置
    - id: home # 菜单项的唯一标识符
      text: Home # 菜单项显示的文本
      href: / # 菜单项链接的地址
      svg: "material-symbols:home-outline-rounded"
      target: _self
    - id: about
      text: About
      href: /about
      svg: "material-symbols:info-outline-rounded"
      target: _self
    - id: blog
      text: Blogs
      href: /blog
      svg: "material-symbols:book-2-outline-rounded"
      target: _self
      subItems:
        - id: all
          text: All blogs
          href: /blog
          svg: "material-symbols:ink-pen-outline-rounded"
          target: _self
        - id: tech
          text: Tech blogs
          href: /blog/category/tech
          svg: "material-symbols:deployed-code-outline"
          target: _self
        - id: life
          text: Life blogs
          href: /blog/category/life
          svg: "material-symbols:earthquake-rounded"
          target: _self
        # 子菜单项配置
    - id: project
      text: Project
      href: /project
      svg: "material-symbols:code-blocks-outline"
      target: _self
    - id: friend
      text: Friend
      href: /friend
      svg: "material-symbols:supervisor-account-outline-rounded"
      target: _self
    - id: contact
      text: Contact
      href: "mailto:contact.evesunmaple@outlook.com"
      target: _blank # 在新标签页打开
      svg: "material-symbols:attach-email-outline-rounded"

# 用户的个人信息
user:
  name: Kistory # 用户名
  site: "https://kistory.netlify.app" # 用户的网站链接
  avatar: /profile.png # 用户头像路径
  sidebar: # 侧边栏配置
    social:
      - href: "https://afdian.com/a/saroprock" # 链接
        ariaLabel: Support my work # 图标的可访问性标签
        title: Support my work # 图标的悬浮标题
        svg: "ri:cup-line"
      - href: "https://github.com/OnlyOneArborInMyHeart"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/438392347"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "https://x.com/EveSunMaple"
        ariaLabel: X(twitter)
        title: X(twitter)
        svg: "ri:twitter-line"
  footer:
    social:
      - href: "https://afdian.com/a/saroprock" # 链接
        ariaLabel: To be my friend # 图标的可访问性标签
        title: To be my friend # 图标的悬浮标题
        svg: "ri:cup-line"
      - href: "https://github.com/EveSunMaple"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/438392347"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "https://x.com/EveSunMaple"
        ariaLabel: X(twitter)
        title: X(twitter)
        svg: "ri:twitter-line"
